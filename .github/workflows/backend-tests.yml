name: Backend tests

# Reusable workflow (called by ci.yml and backend-deploy.yml).
#
# NOTE: the Postgres below is a throwaway container that exists only on the
# GitHub Actions runner while the tests run. It is NOT used by the deployed
# app. The Cloud Run service and job read their configuration (including any
# DATABASE_URL) from Google Secret Manager at runtime.
on:
  workflow_call:

jobs:
  test:
    name: Server - lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpcenteriq
          POSTGRES_PASSWORD: helpcenteriq
          POSTGRES_DB: helpcenteriq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "postgresql://helpcenteriq:helpcenteriq@localhost:5432/helpcenteriq"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Generate throwaway test secrets
        run: |
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ZAF_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ZAF_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Run migrations (test database)
        run: npm run migrate:up
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

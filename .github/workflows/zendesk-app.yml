name: Zendesk app package

# Manual or tag-triggered: builds the dashboard into the Zendesk app, then
# runs zcli apps:validate and apps:package and uploads the zip as an artifact.
#
# No Zendesk credentials are needed here: apps:validate and apps:package are
# offline operations. (Only server operations like apps:update require a login.)
# Nothing is deployed to Zendesk or to the backend from this workflow.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build dashboard into the app package
        run: npm run build --workspace=dashboard
      - run: npm install -g @zendesk/zcli
      - name: Validate ZAF package
        run: zcli apps:validate zendesk-app
      - name: Package ZAF app
        run: zcli apps:package zendesk-app
      - uses: actions/upload-artifact@v4
        with:
          name: zendesk-app
          path: zendesk-app/tmp/*.zip
name: Backend deploy

# Auto-deploys the backend to Google Cloud Run on every merge/push to main
# that touches backend files. Frontend-only commits do not trigger it.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-deploy.yml"

env:
  REGION: asia-south1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpcenteriq
          POSTGRES_PASSWORD: helpcenteriq
          POSTGRES_DB: helpcenteriq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://helpcenteriq:helpcenteriq@localhost:5432/helpcenteriq"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Generate throwaway test secrets
        run: |
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ZAF_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ZAF_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run migrate:up
        working-directory: server
      - run: npm run lint && npm run typecheck && npm test
        working-directory: server

  deploy:
    needs: test # a failed test blocks the deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (no stored keys)
    env:
      IMAGE: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/helpcenter-iq/backend:${{ github.sha }}
      RUNTIME_SA: helpcenter-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      ENVVARS: NODE_ENV=production,AI_PROVIDER=gemini,APP_ORIGIN=${{ vars.APP_ORIGIN }}
      SECRETS: >-
        ZENDESK_OAUTH_CLIENT_ID=ZENDESK_OAUTH_CLIENT_ID:latest,
        ZENDESK_OAUTH_CLIENT_SECRET=ZENDESK_OAUTH_CLIENT_SECRET:latest,
        GEMINI_API_KEY=GEMINI_API_KEY:latest,
        TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest,
        ZAF_SESSION_SECRET=ZAF_SESSION_SECRET:latest,
        ZAF_JWT_SECRET=ZAF_JWT_SECRET:latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare
        run: |
          echo "S=$(echo "$SECRETS" | tr -d ' ')" >> "$GITHUB_ENV"
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy API (Cloud Run service)
        run: |
          gcloud run deploy helpcenteriq-backend \
            --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 3 \
            --set-secrets "$S" \
            --set-env-vars "$ENVVARS"

      - name: Deploy analysis worker (Cloud Run Job)
        run: |
          gcloud run jobs deploy helpcenteriq-worker \
            --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "$S" \
            --set-env-vars "$ENVVARS" \
            --command node --args dist/jobs/runWorkerOnce.js \
            --memory 1Gi --task-timeout 3600 --max-retries 0 \
            --tasks 1 --parallelism 1

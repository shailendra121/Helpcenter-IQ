name: Backend Deploy to Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci-cd.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install & Run Tests
        run: |
          npm ci
          npm test

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/295420833463/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'helpcenteriq-github-deployer@helpcenter-iq.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/helpcenter-iq/helpcenter-iq-repo/backend:${{ github.sha }}"
          LATEST_URI="asia-south1-docker.pkg.dev/helpcenter-iq/helpcenter-iq-repo/backend:latest"
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy Revision to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'helpcenter-backend'
          region: 'asia-south1'
          image: 'asia-south1-docker.pkg.dev/helpcenter-iq/helpcenter-iq-repo/backend:${{ github.sha }}'
          env_vars: |
            NODE_ENV=production
            PORT=8080
            GCP_PROJECT_ID=helpcenter-iq
            GCP_REGION=asia-south1
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            ZENDESK_CLIENT_ID=ZENDESK_CLIENT_ID:latest
            ZENDESK_CLIENT_SECRET=ZENDESK_CLIENT_SECRET:latest
            GEMINI_API_KEY=GEMINI_API_KEY:latest
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server - lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpcenteriq
          POSTGRES_PASSWORD: helpcenteriq
          POSTGRES_DB: helpcenteriq
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "postgresql://helpcenteriq:helpcenteriq@localhost:5432/helpcenteriq"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Generate throwaway test secrets
        run: |
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ZAF_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ZAF_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Run migrations
        run: npm run migrate:up
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  dashboard:
    name: Dashboard - lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - run: npm run lint
      - run: npm run build

    zendesk-app:
    name: Build ZAF app assets (sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard into the app package
        run: npm run build --workspace=dashboard
      - name: Check the app package contents
        run: |
          test -f zendesk-app/assets/iframe.html
          node -e '
            const m = require("./zendesk-app/manifest.json");
            const p = (m.parameters || []).find((x) => x.name === "jwt_secret");
            if (!p || p.secure !== true) throw new Error("manifest: secure jwt_secret parameter missing");
            if (!m.location.support.nav_bar.url.startsWith("assets/")) throw new Error("manifest: dashboard must be served from assets/");
          '
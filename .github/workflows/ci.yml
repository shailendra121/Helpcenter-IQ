name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server tests
    uses: ./.github/workflows/backend-tests.yml

  dashboard:
    name: Dashboard — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  zendesk-app:
    name: Build ZAF app assets (sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard into the app package
        run: npm run build --workspace=dashboard
      - name: Check the app package contents
        run: |
          test -f zendesk-app/assets/iframe.html
          node -e '
            const m = require("./zendesk-app/manifest.json");
            const p = (m.parameters || []).find((x) => x.name === "jwt_secret");
            if (!p || p.secure !== true) throw new Error("manifest: secure jwt_secret parameter missing");
            if (!m.location.support.nav_bar.url.startsWith("assets/")) throw new Error("manifest: dashboard must be served from assets/");
          '
      # zcli apps:validate / apps:package need a Zendesk login, so they run in
      # the manual/tagged workflow: .github/workflows/zendesk-app.yml
